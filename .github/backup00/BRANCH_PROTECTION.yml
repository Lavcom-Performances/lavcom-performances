# Branch Protection Setup Guide
# ─────────────────────────────────────────────────────────────────────────────
# GitHub doesn't allow branch protection rules to be committed as files —
# they must be set via the GitHub UI or API.
# This file documents exactly what to configure.
# ─────────────────────────────────────────────────────────────────────────────

## HOW TO APPLY THESE RULES
# Go to: GitHub Repo → Settings → Branches → Add branch ruleset (or classic rules)

# ═══════════════════════════════════════════════════════════════════════════════
# BRANCH: main  (Production)
# ═══════════════════════════════════════════════════════════════════════════════

main:
  protection:
    # PRs required before merging
    require_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true               # Re-review required after new commits
      require_code_owner_reviews: true          # CODEOWNERS must approve
      dismissal_restrictions: []                # Anyone can dismiss if needed

    # Status checks (add these once CI is running)
    required_status_checks:
      strict: true                              # Branch must be up to date before merge
      contexts:
        - "Lint & Type Check"
        - "Build"
        - "Secret Scan (Gitleaks)"
        - "Dependency Audit"

    # Commit rules
    required_linear_history: false             # Set true if you want squash/rebase only
    allow_force_pushes: false                  # NEVER allow force push to main
    allow_deletions: false                     # NEVER allow deleting main
    block_creations: false

    # Applies to admins too — important for governance
    enforce_admins: true

    # Lovable should NOT be able to push directly to main
    restrictions:
      push_restrictions: []                    # No direct pushes from anyone (PRs only)


# ═══════════════════════════════════════════════════════════════════════════════
# BRANCH: develop  (Integration / Lovable sandbox)
# ═══════════════════════════════════════════════════════════════════════════════

develop:
  protection:
    require_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: false             # Less strict than main
      require_code_owner_reviews: false

    required_status_checks:
      strict: false                            # Allows Lovable to push without full CI
      contexts: []                             # Optional: add "Lint & Type Check" later

    allow_force_pushes: false
    allow_deletions: false
    enforce_admins: false                      # Admins can bypass if needed on develop

    # Lovable IS allowed to push directly to develop
    # (no push restrictions on this branch)


# ═══════════════════════════════════════════════════════════════════════════════
# BRANCH NAMING CONVENTIONS (informational — enforced by team agreement)
# ═══════════════════════════════════════════════════════════════════════════════

naming_conventions:
  feature branches:   "feature/<short-description>"      # e.g. feature/user-profile
  fix branches:       "fix/<short-description>"           # e.g. fix/login-redirect
  hotfix branches:    "hotfix/<short-description>"        # e.g. hotfix/payment-crash
  chore branches:     "chore/<short-description>"         # e.g. chore/update-deps
  lovable branches:   "lovable/<short-description>"       # e.g. lovable/redesign-nav


# ═══════════════════════════════════════════════════════════════════════════════
# OPTIONAL: GitHub API — apply main protection programmatically
# ═══════════════════════════════════════════════════════════════════════════════
#
# If you prefer to apply via CLI (requires gh CLI + admin token):
#
#   gh api repos/{owner}/{repo}/branches/main/protection \
#     --method PUT \
#     --field required_status_checks='{"strict":true,"contexts":["Lint & Type Check","Build"]}' \
#     --field enforce_admins=true \
#     --field required_pull_request_reviews='{"required_approving_review_count":1,"dismiss_stale_reviews":true}' \
#     --field restrictions=null
