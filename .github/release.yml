name: Release — Promote develop to main

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Brief description of this release'
        required: true
        type: string
      skip_ci_check:
        description: 'Skip CI check (emergency only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  promote:
    name: Promote develop → main
    runs-on: ubuntu-latest
    environment: production   # Requires manual approval if configured in GitHub

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify develop is ahead of main
        run: |
          git fetch origin main
          BEHIND=$(git rev-list --count origin/main..origin/develop)
          if [ "$BEHIND" -eq "0" ]; then
            echo "❌ develop has no new commits ahead of main. Nothing to release."
            exit 1
          fi
          echo "✅ develop is $BEHIND commits ahead of main."

      - name: Merge develop into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff develop -m "release: ${{ github.event.inputs.release_note }} [skip ci]"
          git push origin main

      - name: Tag the release
        run: |
          DATE=$(date +'%Y.%m.%d')
          RUN=${{ github.run_number }}
          TAG="release-${DATE}-${RUN}"
          git tag -a "$TAG" -m "Release: ${{ github.event.inputs.release_note }}"
          git push origin "$TAG"
          echo "✅ Tagged as $TAG"

      - name: Post release summary
        run: |
          echo "## ✅ Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** develop → main" >> $GITHUB_STEP_SUMMARY
          echo "- **Note:** ${{ github.event.inputs.release_note }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
